# VerifyOS MR 审查配置（本机实例，服务于 Conduit 演示被测系统）
# ② pr.hardSteps：真实 UI 确定性操作链 + 硬断言（追加在登录+AI 回归之后）
# 注意：express-realworld 校验 description 必填（漏填 → POST /api/articles 422）
pr:
  gate: fail_block
  # G1 门禁模式：blocking=断言失败阻止合并（默认）；reporting=只评论不拦合并（评论标注「ℹ️ 非阻塞」）
  gateMode: blocking
  # G1 分档计划：smoke=PR 冒烟档（默认）；命中 fullTriggers 自动升 full（全量回归档）
  plan: smoke
  # G1 升档 full 触发条件：分支 * 通配（release/* 匹配 release/1.2 等）或 MR label 精确命中
  fullTriggers:
    branches:
      - release/*
    labels: []
  hardSteps:
    - title: 硬断言：真创建纯中文标题文章并断言 slug 非空格式
      goto: "{{envUrl}}/editor"
      actions:
        - type: fill
          selector: "input[placeholder='Article Title']"
          value: "纯中文验证标题{{ts}}"
        - type: fill
          selector: "input[placeholder='What\'s this article about?']"
          value: "VerifyOS 自动回归"
        - type: fill
          selector: "textarea[placeholder='Write your article (in markdown)']"
          value: "VerifyOS 自动回归：纯中文标题必须生成非空 slug（MR !1 修复验证）。"
        - type: click
          selector: "button.btn-primary"
      assert:
        kind: url_matches
        value: "/article/.+-[0-9]+$"
      targetRef: "/article/"
